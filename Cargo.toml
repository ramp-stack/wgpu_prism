[package]
name = "wgpu_prism"
version = "6.0.0"
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/ramp-stack/wgpu_prism.git"
description = "A WGPU renderer for Prism drawing instructions."
documentation = "https://docs.rs/wgpu_prism"
readme = "README.md"
keywords = ["wgpu", "prism", "2d", "graphics", "rust"]
categories = ["graphics", "rendering", "gui"]

exclude = ["**/.DS_Store", ".idea/**"]

[dependencies]
prism = {package = "prism2", path = "../prism"}
wgpu = "25.0.0"
bytemuck = "1.21.0"
image = "0.24.9"
swash = "0.2.10"
